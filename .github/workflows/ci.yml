name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs of this workflow when a new commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ESLint + Prettier gate. No OMC, no build — pure static checks.
  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

  # Fast feedback: typecheck, parser tests. No OMC needed.
  lint-and-unit:
    name: Lint + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm -r typecheck

      - name: coverage.md ↔ filesystem recount
        run: pnpm --filter @dicode/omc-client coverage:recount

      - name: Unit tests (parser, version, registry)
        env:
          OMC_INTEGRATION: "0"
        run: pnpm -r test

  # Integration tests against the pinned OMC release. Renovate keeps the
  # image tag in lock-step with `SUPPORTED_OMC.primary` via the regex manager
  # in renovate.json.
  integration:
    name: Integration (OMC ${{ matrix.omc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        omc: ["v1.26.7"]
    container:
      image: openmodelica/openmodelica:${{ matrix.omc }}-minimal
      # GitHub Actions runs container jobs as root by default.
      options: --user root
    steps:
      - name: Install Node 20 + git into the OMC container
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg git
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y --no-install-recommends nodejs
          npm install -g pnpm@10.25.0
          useradd -m -s /bin/bash omcrunner

      - uses: actions/checkout@v4

      - name: Verify OMC matches the pin
        run: |
          OMC_RUNTIME=$(omc --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          OMC_PIN=$(grep -E '^\s*primary:' packages/omc-client/src/version.ts | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Container OMC: $OMC_RUNTIME"
          echo "Pinned OMC:    $OMC_PIN"
          if [ "$OMC_RUNTIME" != "$OMC_PIN" ]; then
            echo "::warning::Pin/runtime mismatch — container is $OMC_RUNTIME, pin is $OMC_PIN. The integration tests still run, but a Renovate PR is probably needed to bump the pin."
          fi

      - run: pnpm install --frozen-lockfile

      - name: Hand workspace to non-root user
        run: chown -R omcrunner:omcrunner "$GITHUB_WORKSPACE"

      - name: Install Modelica Standard Library for omcrunner
        run: |
          cat > /tmp/install_msl.mos <<'EOF'
          installPackage(Modelica, "4.1.0+maint.om", exactMatch=true);
          getErrorString();
          EOF
          runuser -u omcrunner -- omc /tmp/install_msl.mos

      - name: Integration tests against real OMC
        env:
          OMC_INTEGRATION: "1"
          OMC_INTEGRATION_HEAVY: "1"
          OMC_DEBUG: "1"
        run: runuser -u omcrunner -- pnpm --filter @dicode/omc-client test

      - name: Build the extension bundle
        run: pnpm --filter modelica-wrapper build

  # End-to-end smoke: drive the built extension inside a real code-server via
  # Playwright. The baseline spec runs against `main`'s declarative
  # contributions; feature PRs land their own `*.spec.ts` next to it (see
  # `packages/extension/e2e/README.md`). OMC-dependent specs are gated behind
  # `E2E_OMC=1` and intentionally NOT enabled here — keeping this job fast and
  # flake-free. code-server is pinned to the version the harness was tested
  # against; bump it together with `packages/extension/e2e/README.md`.
  e2e:
    name: E2E (Playwright + code-server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the extension bundle
        run: pnpm --filter modelica-wrapper build

      - name: Install code-server 4.108.0
        run: |
          curl -fsSL -o /tmp/code-server.deb \
            https://github.com/coder/code-server/releases/download/v4.108.0/code-server_4.108.0_amd64.deb
          sudo apt-get install -y /tmp/code-server.deb
          code-server --version

      - name: Install e2e harness deps
        working-directory: packages/extension/e2e
        run: npm ci

      - name: Install Playwright Chromium + system deps
        working-directory: packages/extension/e2e
        run: npm run install-browsers

      - name: Run e2e
        run: pnpm --filter modelica-wrapper test:e2e

      - name: Upload Playwright traces + code-server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            packages/extension/e2e/test-results/
            /tmp/mw-e2e-*/code-server.log
          if-no-files-found: ignore
          retention-days: 7

  # Real-browser coverage for the diagram-ui webview components — Playwright
  # drives Storybook stories. The only gate on interactions happy-dom can't run
  # (Lit @event on custom elements; the Babylon pointer / pan-zoom paths).
  diagram-ui-e2e:
    name: E2E (Playwright + diagram-ui)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium + system deps
        run: pnpm --filter @dicode/diagram-ui exec playwright install --with-deps chromium

      - name: Run diagram-ui e2e
        run: pnpm --filter @dicode/diagram-ui test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagram-ui-e2e-artifacts
          path: |
            packages/diagram-ui/test-results/
            packages/diagram-ui/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
