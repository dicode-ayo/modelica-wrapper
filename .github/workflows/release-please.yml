name: Release Please

# Maintains a rolling "release PR" off the Conventional Commits that land on
# main. Merging that PR bumps the version, updates CHANGELOG.md, tags the
# release, and creates a GitHub Release. Manifest-driven so the monorepo
# layout is described once in release-please-config.json.
#
# When a release is cut, the `publish-npm` job below builds every workspace
# library with tsup and publishes the ones Release Please just bumped to the
# npm registry under the @dicode scope. The VSCode extension stays
# `private: true`, so it is skipped by the npm publish. Instead, when
# Release Please bumps the extension specifically, `attach-vsix` packages it
# and uploads the .vsix to the GitHub Release it just created, for anyone who
# wants to `code --install-extension` it without a Marketplace publish (which
# is a separate, still-to-be-added job — see the follow-up issue).
#
# The extension's release is configured `draft: true` in
# release-please-config.json specifically so it stays unpublished (and
# editable) until `attach-vsix` uploads the .vsix and un-drafts it as its
# last step — otherwise the release goes live, and watchers see it, before
# the artifact it links to exists. A failed build/package step leaves the
# release in draft rather than publishing an incomplete one. The library
# packages aren't drafted: they have no artifact-attach step to wait on.
#
# Token notes:
# - GITHUB_TOKEN is used for the release step. Workflows triggered by the
#   release tag/PR it creates will NOT fire (GitHub suppresses recursive
#   workflow runs for the default token). If you later want CI (ci.yml) or a
#   VSIX publish to run automatically on the release PR or tag, swap
#   secrets.GITHUB_TOKEN for a fine-grained PAT (or a GitHub App token) stored
#   as e.g. RELEASE_PLEASE_TOKEN.
# - NPM_TOKEN must be configured as a repo secret for the publish job: an npm
#   automation/granular token with publish rights to the @dicode
#   scope. With id-token: write + NPM_CONFIG_PROVENANCE the publish also
#   attaches npm provenance.

on:
  push:
    branches: [main]

# Only one release run per ref; a newer push supersedes an in-flight one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR + tagging
    runs-on: ubuntu-latest
    # Expose the action outputs so the publish job can decide whether to run
    # and (if ever needed) which package paths were released.
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      extension_release_created: ${{ steps.release.outputs['packages/extension--release_created'] }}
      extension_tag_name: ${{ steps.release.outputs['packages/extension--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    name: Publish libraries to npm
    needs: release-please
    # Only run when Release Please actually cut at least one release this run.
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # id-token: write lets npm attach build provenance to the published
      # tarballs (paired with NPM_CONFIG_PROVENANCE below).
      id-token: write
    steps:
      # Neither this job nor `attach-vsix` below ever does a git push — both
      # only call `pnpm publish`/`gh` with their own tokens — so the checkout
      # has no need to leave a write-scoped credential on disk for the
      # dependency install further down (and its native-addon build scripts)
      # to find.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all libraries (tsup)
        run: pnpm -r build

      # `pnpm -r publish` only publishes workspace packages whose current
      # version isn't already on the registry — which is exactly the set
      # Release Please just bumped (everything else is a no-op "already
      # published"). The extension keeps `private: true`, so it is skipped
      # automatically. If finer-grained control is ever needed, the released
      # paths are available as needs.release-please.outputs.paths_released.
      - name: Publish to npm
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  attach-vsix:
    name: Attach VSIX to GitHub Release
    needs: release-please
    # Only when this run's release bumped the extension specifically.
    if: ${{ needs.release-please.outputs.extension_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # See the matching comment on publish-npm's checkout: this job's
      # `contents: write` token has no business persisting to disk for
      # dependency install scripts to find.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Production esbuild build (no sourcemaps) + `vsce package
      # --no-dependencies`, run straight in the workspace — everything but
      # `vscode` is bundled, so the VSIX ships no node_modules and packaging
      # needs no registry access.
      - name: Build and package the VSIX
        run: pnpm --filter modelica-wrapper package

      # The filename carries the version (vsce's default), so this globs
      # rather than hardcoding it. TAG_NAME rides in via `env` rather than
      # interpolated straight into the script — release-please computes it
      # from a fixed component name + SemVer today, but nothing enforces
      # that going forward, and env-substitution costs nothing.
      - name: Upload VSIX to the GitHub Release
        run: gh release upload "$TAG_NAME" packages/extension/modelica-wrapper-*.vsix --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.extension_tag_name }}

      # The release was created as a draft (release-please-config.json) so it
      # stays unpublished until this point — publish it now that its .vsix
      # actually exists.
      - name: Publish the release now that its VSIX is attached
        run: gh release edit "$TAG_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.extension_tag_name }}
