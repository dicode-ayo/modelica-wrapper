name: Chromatic

# Publishes the Storybook bundles for both visual-eval packages to
# Chromatic on every push and PR so reviewers can inspect the live
# rendering on the PR and visual diffs flag for follow-up.
#
# Setup: each package has its own Chromatic project, so each job needs
# its own repo secret:
#
#   gh secret set CHROMATIC_PROJECT_TOKEN            -b "<chpt_… for diagram-svg>"
#   gh secret set CHROMATIC_DIAGRAM_UI_PROJECT_TOKEN -b "<chpt_… for diagram-ui>"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight Chromatic build per ref is enough — newer pushes supersede.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagram-svg:
    name: Publish diagram-svg Storybook
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic needs full git history to find baselines for diffing.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build inside the workspace so pnpm resolves @modelica-wrapper/omc-client
      # via the workspace link rather than npm. Chromatic's action accepts a
      # pre-built directory via `storybookBuildDir`.
      - name: Build Storybook
        run: pnpm --filter @modelica-wrapper/diagram-svg build-storybook

      - name: Publish to Chromatic
        uses: chromaui/action@v11
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/diagram-svg
          storybookBuildDir: storybook-static
          # Don't fail the workflow on visual diffs — they go to the Chromatic
          # UI for review. Build-breaking errors (test failures, missing token)
          # still fail.
          exitZeroOnChanges: true
          # NOTE: `onlyChanged: true` requires `preview-stats.json` from the
          # Storybook build (TurboSnap input). The Vite Storybook builder
          # doesn't emit one by default; with `onlyChanged: true` set, the
          # Chromatic CLI then fails the whole job. Disabled until we wire
          # `--stats-json` into `build-storybook` or migrate to a builder
          # that emits stats out of the box.

  diagram-ui:
    name: Publish diagram-ui Storybook
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm --filter @modelica-wrapper/diagram-ui build-storybook

      # Guarded so a missing CHROMATIC_DIAGRAM_UI_PROJECT_TOKEN secret
      # doesn't fail CI before the project is created on Chromatic.
      # Once the secret is set, this step publishes normally.
      - name: Check token
        id: token
        run: |
          if [ -n "${{ secrets.CHROMATIC_DIAGRAM_UI_PROJECT_TOKEN }}" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CHROMATIC_DIAGRAM_UI_PROJECT_TOKEN is unset; skipping Chromatic publish for diagram-ui. Set it once with: gh secret set CHROMATIC_DIAGRAM_UI_PROJECT_TOKEN -b '<chpt_… token>'"
          fi

      - name: Publish to Chromatic
        if: steps.token.outputs.has == 'true'
        uses: chromaui/action@v11
        with:
          projectToken: ${{ secrets.CHROMATIC_DIAGRAM_UI_PROJECT_TOKEN }}
          workingDir: packages/diagram-ui
          storybookBuildDir: storybook-static
          exitZeroOnChanges: true
          # See note in the diagram-svg job: TurboSnap disabled until the
          # Vite Storybook build emits preview-stats.json.
