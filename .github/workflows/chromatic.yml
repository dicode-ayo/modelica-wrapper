name: Chromatic

# Publishes the combined Storybook (diagram-svg + diagram-ui + result-ui,
# aggregated by @dicode/storybook) to a single Chromatic project on
# every push and PR, so reviewers can inspect the live rendering on the PR and
# visual diffs flag for follow-up.
#
# Setup: one repo secret holds the project token for the combined project:
#
#   gh secret set CHROMATIC_PROJECT_TOKEN -b "<chpt_… for the combined project>"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight Chromatic build per ref is enough — newer pushes supersede.
# Only cancel PR builds: a cancelled build never becomes a baseline, so main
# builds must run to completion to record the baseline for later diffs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    name: Publish combined Storybook
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Chromatic needs full git history to find baselines for diffing.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build inside the workspace so pnpm resolves the workspace links
      # (@dicode/*) rather than npm. Chromatic's action takes the
      # pre-built directory via `storybookBuildDir`.
      - name: Build Storybook
        run: pnpm --filter @dicode/storybook build-storybook

      - name: Publish to Chromatic
        uses: chromaui/action@v18
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/storybook
          storybookBuildDir: storybook-static
          # Don't fail the workflow on visual diffs — they go to the Chromatic
          # UI for review. Build-breaking errors (missing token, build failure)
          # still fail.
          exitZeroOnChanges: true
          # Squash merges write a fresh main commit with no ancestry to the PR
          # where snapshots were accepted, so accepted baselines don't carry
          # over. Code on main is already reviewed and merged — let the
          # post-merge main build bless the current render as the new baseline.
          autoAcceptChanges: main
          # TurboSnap: only snapshot stories whose code (or imported deps)
          # changed since the baseline, so a typical PR bills a handful of
          # snapshots instead of the whole Storybook. Relies on
          # `preview-stats.json`, which `build-storybook` now emits via
          # `--stats-json`.
          onlyChanged: true
