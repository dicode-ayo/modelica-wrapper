# Temporary validation for PR #502: exercises the attach-vsix release
# mechanics (draft release with a pending tag -> asset upload by tag ->
# edit by tag) against the real GITHUB_TOKEN and runner gh version, without
# publishing anything. The draft is deleted at the end; drafts are invisible
# to non-maintainers and create no git tag. Removed once validated.
name: VSIX flow dry run

on:
  push:
    branches: [claude/elegant-albattani-7fx6po]
    paths: [".github/workflows/vsix-flow-dry-run.yml"]

permissions:
  contents: write

jobs:
  dry-run:
    name: Draft release round trip
    runs-on: ubuntu-latest
    steps:
      - name: Create draft, upload by tag, edit by tag, verify, delete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: vsix-flow-dry-run-${{ github.run_id }}
        run: |
          set -euxo pipefail
          gh --version
          cleanup() { gh release delete "$TAG_NAME" --yes --repo "$GITHUB_REPOSITORY" || true; }
          trap cleanup EXIT
          # Same object shape release-please creates: draft release whose
          # tag does not exist yet.
          gh release create "$TAG_NAME" --draft \
            --title "attach-vsix dry run (safe to delete)" \
            --notes "Temporary draft validating PR #502's release flow; never published." \
            --repo "$GITHUB_REPOSITORY"
          echo "dry-run artifact" > modelica-wrapper-0.0.0-dry-run.vsix
          # The two operations attach-vsix performs, addressed by tag while
          # the release is still a tagless draft:
          gh release upload "$TAG_NAME" modelica-wrapper-*.vsix --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG_NAME" --notes "edited while draft" --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG_NAME" --json isDraft,tagName,assets --repo "$GITHUB_REPOSITORY" | tee view.json
          python3 - <<'PY'
          import json
          r = json.load(open("view.json"))
          assert r["isDraft"] is True, r
          names = [a["name"] for a in r["assets"]]
          assert "modelica-wrapper-0.0.0-dry-run.vsix" in names, names
          print("draft round trip OK:", names)
          PY
          # A draft release must not have materialized a git tag.
          if git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/$TAG_NAME" | grep -q .; then
            echo "unexpected: tag exists for a draft release"; exit 1
          fi
