name: Setup pnpm + Node
description: Install pnpm, set up Node 20, and install workspace dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        version: 10.34.5

    - uses: actions/setup-node@v7
      with:
        node-version: 24.20.0
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
